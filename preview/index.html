<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Remote TV - Modern White (iPhone 6 Plus)</title>
    <style>
        :root {
            --bg-canvas: #e6e9ee;
            --phone-bg: #f6f7fa;
            --surface: #ffffff;
            --surface-pressed: #eef0f4;
            --border: #e2e6ec;
            --divider: #ebeef2;
            --icon-dark: #212529;
            --text-muted: #788291;
            --power-red: #ef4444;
            --connected-green: #22c55e;
            --shadow-soft: 0 6px 20px rgba(20, 30, 50, 0.08);
            --shadow-btn: 0 4px 10px rgba(20, 30, 50, 0.06);
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-canvas);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
            padding: 20px;
        }

        /* Dimensiones reales del iPhone 6 Plus (414 x 736 pt) */
        .iphone-frame {
            width: 414px;
            height: 736px;
            background-color: var(--phone-bg);
            border-radius: 44px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.28), 0 0 0 12px #ffffff;
            position: relative;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid var(--border);
        }

        .status-bar {
            height: 28px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 28px;
            font-size: 12px;
            font-weight: 600;
            color: var(--icon-dark);
        }

        .remote-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 12px 28px 24px 28px;
            justify-content: space-between;
        }

        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 48px;
        }

        .status-pill {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 22px;
            padding: 10px 18px;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: var(--shadow-btn);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .status-pill:active {
            transform: scale(0.96);
            background: var(--surface-pressed);
        }

        .status-dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: var(--connected-green);
        }

        .status-text {
            font-size: 14px;
            font-weight: 700;
            color: var(--icon-dark);
        }

        .status-chevron {
            font-size: 13px;
            color: var(--text-muted);
        }

        .btn-power {
            width: 46px;
            height: 46px;
            border-radius: 16px;
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--power-red);
            font-size: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: var(--shadow-btn);
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .btn-power:active {
            transform: scale(0.92);
            background: var(--surface-pressed);
        }

        /* D-Pad Ampliado */
        .dpad-wrapper {
            display: flex;
            justify-content: center;
            margin: 10px 0;
        }

        .dpad {
            width: 246px;
            height: 246px;
            border-radius: 50%;
            background: var(--surface);
            border: 1px solid var(--border);
            box-shadow: var(--shadow-soft);
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .dpad-dir {
            position: absolute;
            background: none;
            border: none;
            color: var(--icon-dark);
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.1s ease;
        }

        .dpad-dir:active {
            opacity: 0.5;
            transform: scale(0.9);
        }

        .dpad-up { top: 14px; left: 0; right: 0; height: 56px; }
        .dpad-down { bottom: 14px; left: 0; right: 0; height: 56px; }
        .dpad-left { left: 14px; top: 0; bottom: 0; width: 56px; }
        .dpad-right { right: 14px; top: 0; bottom: 0; width: 56px; }

        .dpad-center {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: var(--surface);
            border: 1px solid var(--border);
            box-shadow: var(--shadow-btn);
            font-size: 20px;
            font-weight: 700;
            color: var(--icon-dark);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s ease;
            z-index: 2;
        }

        .dpad-center:active {
            transform: scale(0.92);
            background: var(--surface-pressed);
        }

        /* Fila de Navegación Ampliada (64x64 pt) */
        .nav-row {
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 0 16px;
        }

        .btn-round-large {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--icon-dark);
            font-size: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: var(--shadow-btn);
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .btn-round-large:active {
            transform: scale(0.92);
            background: var(--surface-pressed);
        }

        /* Panel Inferior Moderno (Cápsulas) */
        .bottom-panel {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 10px;
            margin-bottom: 6px;
        }

        .capsule {
            width: 70px;
            height: 144px;
            border-radius: 35px;
            background: var(--surface);
            border: 1px solid var(--border);
            box-shadow: var(--shadow-btn);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .capsule-btn {
            flex: 1;
            background: none;
            border: none;
            color: var(--icon-dark);
            font-size: 22px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.15s ease;
        }

        .capsule-btn:active {
            background: var(--surface-pressed);
        }

        .capsule-divider {
            height: 1px;
            background: var(--divider);
            margin: 0 14px;
        }

        .center-actions {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .btn-round-med {
            width: 58px;
            height: 58px;
            border-radius: 50%;
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--icon-dark);
            font-size: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: var(--shadow-btn);
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .btn-round-med:active {
            transform: scale(0.92);
            background: var(--surface-pressed);
        }

        .toast-label {
            text-align: center;
            font-size: 11px;
            color: var(--text-muted);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

    <div class="iphone-frame">
        <div class="status-bar">
            <span>9:41</span>
            <span>LTE • 100%</span>
        </div>

        <div class="remote-container">
            <!-- Header -->
            <div class="header">
                <div class="status-pill" onclick="alert('Selector de TVs')">
                    <div class="status-dot"></div>
                    <span class="status-text">Living Room TV</span>
                    <span class="status-chevron">▾</span>
                </div>
                <button class="btn-power" onclick="sendCmd('POWER')">⏻</button>
            </div>

            <!-- D-Pad Central Ampliado -->
            <div class="dpad-wrapper">
                <div class="dpad">
                    <button class="dpad-dir dpad-up" onclick="sendCmd('DPAD_UP')">▲</button>
                    <button class="dpad-dir dpad-down" onclick="sendCmd('DPAD_DOWN')">▼</button>
                    <button class="dpad-dir dpad-left" onclick="sendCmd('DPAD_LEFT')">◀</button>
                    <button class="dpad-dir dpad-right" onclick="sendCmd('DPAD_RIGHT')">▶</button>
                    <button class="dpad-center" onclick="sendCmd('OK')">OK</button>
                </div>
            </div>

            <!-- Fila de Navegación Ampliada -->
            <div class="nav-row">
                <button class="btn-round-large" title="Atrás" onclick="sendCmd('BACK')">‹</button>
                <button class="btn-round-large" title="Inicio" onclick="sendCmd('HOME')">⌂</button>
                <button class="btn-round-large" title="Menú" onclick="sendCmd('MENU')">≡</button>
            </div>

            <!-- Panel Inferior Moderno -->
            <div class="bottom-panel">
                <!-- Cápsula de Volumen -->
                <div class="capsule">
                    <button class="capsule-btn" onclick="sendCmd('VOL+')">+</button>
                    <div class="capsule-divider"></div>
                    <button class="capsule-btn" onclick="sendCmd('VOL-')">−</button>
                </div>

                <!-- Acciones Centrales -->
                <div class="center-actions">
                    <button class="btn-round-med" title="Play/Pause" onclick="sendCmd('PLAY/PAUSE')">⏯</button>
                    <button class="btn-round-med" title="Silencio" onclick="sendCmd('MUTE')">🔇</button>
                </div>

                <!-- Cápsula de Canales -->
                <div class="capsule">
                    <button class="capsule-btn" onclick="sendCmd('CH+')">▲</button>
                    <div class="capsule-divider"></div>
                    <button class="capsule-btn" onclick="sendCmd('CH-')">▼</button>
                </div>
            </div>

            <div class="toast-label" id="toastMessage">Listo • Pulsa cualquier botón</div>
        </div>
    </div>

    <script>
        function sendCmd(cmd) {
            const toast = document.getElementById('toastMessage');
            toast.textContent = "Comando: " + cmd;
            toast.style.color = "#007aff";
            setTimeout(() => {
                toast.textContent = "Listo • Pulsa cualquier botón";
                toast.style.color = "var(--text-muted)";
            }, 1000);
        }
    </script>
</body>
</html>
