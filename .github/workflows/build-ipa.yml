name: Build RemoteTV IPA for iOS 12

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Compile and Package IPA
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Show Xcode Version
        run: xcodebuild -version

      - name: Build App for iOS (arm64, iOS 12.0)
        run: |
          set -o pipefail
          xcodebuild clean build \
            -project RemoteTv.xcodeproj \
            -scheme RemoteTv \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CONFIGURATION_BUILD_DIR=build/Release-iphoneos \
            2>&1 | tee build_log.txt; exit ${PIPESTATUS[0]}

      - name: Upload Build Log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build_log.txt
          retention-days: 3

      - name: Package Payload into IPA
        run: |
          mkdir -p build/Payload
          cp -r build/Release-iphoneos/RemoteTv.app build/Payload/
          cd build
          zip -r -q RemoteTv.ipa Payload
          ls -lh RemoteTv.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RemoteTv-iOS12
          path: build/RemoteTv.ipa
          retention-days: 7
